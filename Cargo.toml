[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4

# 0.24.1 的 SelectionItemPattern 不认 Cell/RowHeader/ColumnHeader（上游 0.35 只加了
# GridCell），这里本地打一行补丁，让 UIA 的 IsSelected 对网格单元格与行列标可用。
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
