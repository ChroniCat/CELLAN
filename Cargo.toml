[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "1.70.0"
edition = "2024"
description = "CELLAN — Concurrent Engine for Local-first, Lock-free Async Networks"
repository = "https://github.com/ChroniCat/finance-native-sheets"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# 协作房间口令用 PBKDF2 拉伸（故意慢），工作簿加密也要跑 10 万轮 SHA-512。
# 调试构建里未优化的哈希压缩函数会慢一个数量级，让测试里的握手超时；
# 只对哈希库开优化，不影响其余代码的调试体验。
[profile.dev.package.sha2]
opt-level = 3

# 0.24.1 的 SelectionItemPattern 不认 Cell/RowHeader/ColumnHeader（上游 0.35 只加了
# GridCell），这里本地打一行补丁，让 UIA 的 IsSelected 对网格单元格与行列标可用。
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
