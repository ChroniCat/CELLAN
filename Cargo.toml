[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "1.85.0"
edition = "2024"
license = "MIT"
description = "CELLAN — Concurrent Engine for Local-first, Lock-free Async Networks"
repository = "https://github.com/ChroniCat/CELLAN"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# 基准测试与高频剖析采用 thin LTO + 16 并行代码生成单元（继承 release 的 opt-level = 3），
# 将大型套件编译耗时从 ~9 分钟缩短至 ~1 分钟；正式发版仍走上方 fat LTO。
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

# 协作房间口令用 PBKDF2 拉伸（故意慢），工作簿加密也要跑 10 万轮 SHA-512。
# 调试构建里未优化的哈希压缩函数会慢一个数量级，让测试里的握手超时；
# 只对哈希库开优化，不影响其余代码的调试体验。
[profile.dev.package.sha2]
opt-level = 3

# 0.24.1 的 SelectionItemPattern 不认 Cell/RowHeader/ColumnHeader（上游 0.35 只加了
# GridCell），这里本地打一行补丁，让 UIA 的 IsSelected 对网格单元格与行列标可用。
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
epaint = { path = "vendor/epaint" }
egui-wgpu = { path = "vendor/egui-wgpu" }
egui_glow = { path = "vendor/egui_glow" }
