[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7"
eframe = { version = "0.31", default-features = false, features = ["default_fonts"] }
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
sheetcore = { version = "0.1.0", path = "../core" }

[features]
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
