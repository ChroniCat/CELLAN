[package]
name = "app"
version = "1.75.0"
edition = "2024"
description = "CELLAN Desktop — Concurrent Engine for Local-first, Lock-free Async Networks"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "accesskit"] }
getrandom = "0.3.4"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
immutable-chunkmap = "2.1.5"
quick-xml = "0.42"
rfd = "0.17.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
sheetcore = { version = "1.75.0", path = "../core" }
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.52"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_StationsAndDesktops"] }

[features]
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
legacy_png_icons = []
