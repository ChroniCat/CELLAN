[package]
name = "sheetcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "sheetcore"
path = "src/lib.rs"

[dependencies]
sha2 = "0.11.1"
aes = "0.9.4"
cfb = "0.14.0"
getrandom = "0.3.4"
base64 = "0.22"
anyhow = "1.0.104"
calamine = "0.38.0"
quick-xml = "0.42"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
umya-spreadsheet = "3.1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.52", features = ["Win32_System_ProcessStatus", "Win32_Foundation", "Win32_System_Threading"] }
