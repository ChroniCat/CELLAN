[package]
name = "sheetcore"
version = "1.86.0"
edition = "2024"
license = "MIT"
repository.workspace = true
description = "CELLAN Core Spreadsheet & Peer Sync Engine"

[lib]
name = "sheetcore"
path = "src/lib.rs"

[dependencies]
stacker = "0.1.25"
sha2 = "0.11.1"
aes = "0.9.4"
cfb = "0.14.0"
getrandom = "0.3.4"
base64 = "0.22"
anyhow = "1.0.104"
tempfile = "3.27"
calamine = "0.38.0"
encoding_rs = "0.8"
roxmltree = "0.21"
quick-xml = "0.42"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
ttf-parser = "0.25"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"
windows-sys = { version = "0.52", features = ["Win32_System_ProcessStatus", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
mimalloc = "0.1.52"
